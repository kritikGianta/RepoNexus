<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" font-family="Hanken Grotesk, Arial, sans-serif">
  <rect width="800" height="960" fill="#f8f7f1"/>
  <rect x="60" y="90" width="520" height="84" rx="22" fill="#181a17"/>
  <text x="92" y="140" fill="#f2f0e7" font-size="22">Where is authentication handled?</text>
  <rect x="140" y="214" width="600" height="380" rx="22" fill="#e7e5da"/>
  <circle cx="186" cy="262" r="18" fill="#dce87a"/><text x="186" y="269" text-anchor="middle" font-size="16" font-weight="800" fill="#181a17">R</text>
  <g font-size="20" fill="#181a17">
    <text x="220" y="270">Auth lives in two places:</text>
    <text x="180" y="320">1. <tspan font-family="JetBrains Mono, monospace" font-size="17" fill="#5a6b1e">app/core/oauth.py</tspan> exchanges</text>
    <text x="206" y="350">the GitHub code for a token.</text>
    <text x="180" y="400">2. <tspan font-family="JetBrains Mono, monospace" font-size="17" fill="#5a6b1e">app/api/deps.py</tspan> validates</text>
    <text x="206" y="430">the JWT on every request.</text>
  </g>
  <rect x="180" y="470" width="520" height="90" rx="10" fill="#181a17"/>
  <text x="204" y="506" fill="#8b9084" font-family="JetBrains Mono, monospace" font-size="15">payload = decode_access_token(</text>
  <text x="204" y="534" fill="#dce87a" font-family="JetBrains Mono, monospace" font-size="15">    credentials.credentials)</text>
  <text x="60" y="760" fill="#181a17" font-size="96" font-weight="900" letter-spacing="-5">Just ask.</text>
  <text x="60" y="850" fill="#5e6258" font-size="64" font-style="italic" font-family="Fraunces, Georgia, serif">grounded in your code.</text>
</svg>
