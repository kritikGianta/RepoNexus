# ==========================================================
# RepoNexus — local stack (Docker Desktop)
# ==========================================================
#   docker compose up -d --build     build & start everything
#   docker compose logs -f backend   follow API logs
#   docker compose down              stop (data is kept)
#   docker compose down -v           stop and wipe all data
#
# App:     http://localhost:8080
# API:     http://localhost:8000/docs
# MLflow:  http://localhost:5000
# MySQL:   localhost:3306 (user/db: reponexus)
# ==========================================================

name: reponexus

x-backend-env: &backend-env
  ENVIRONMENT: production
  DATABASE_URL: mysql+aiomysql://reponexus:${MYSQL_PASSWORD:-reponexus}@mysql:3306/reponexus?charset=utf8mb4
  REDIS_URL: redis://redis:6379/0
  TASK_EXECUTION_MODE: celery
  MLFLOW_TRACKING_URI: http://mlflow:5000
  API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
  CORS_ORIGINS: http://localhost:8080,http://localhost:5175
  GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8080/auth/github/callback}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: reponexus
      MYSQL_USER: reponexus
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-reponexus}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-reponexus-root}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # TCP ping fails while the image's init-only server (no networking) is running
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u reponexus -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.20.1
    restart: unless-stopped
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: reponexus-backend:local
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data

  worker:
    image: reponexus-backend:local
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=analysis", "--concurrency=2"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    image: reponexus-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  mysql_data:
  redis_data:
  mlflow_data:
  backend_data:
